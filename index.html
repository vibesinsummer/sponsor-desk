<title>커뮤니케이션 2국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 방송 큐시트처럼 시간·출처가 왼쪽에 붙는 행 목록 + 상단 고정 탭. 신호(기회/주의/홍보라인)는 색 띠로 표시 */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --line: #dde2ea; --ink: #141a24; --muted: #5c6878; --faint: #8b95a5;
  --accent: #1f4fd1; --accent-soft: #e6edfd;
  --good: #0f7a4f; --good-soft: #e3f4ec; --warn: #b4232a; --warn-soft: #fbe9ea; --pr: #8a4b00; --pr-soft: #fdf0dc;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171c25; --line: #2a3240; --ink: #e8ecf2; --muted: #9aa5b5; --faint: #6d7889;
  --accent: #7ea2ff; --accent-soft: #1d2a4a; --good: #4fc893; --good-soft: #13291f; --warn: #ff7b7f; --warn-soft: #351a1c; --pr: #f0b45c; --pr-soft: #33260f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c25; --line: #2a3240; --ink: #e8ecf2; --muted: #9aa5b5; --faint: #6d7889;
  --accent: #7ea2ff; --accent-soft: #1d2a4a; --good: #4fc893; --good-soft: #13291f; --warn: #ff7b7f; --warn-soft: #351a1c; --pr: #f0b45c; --pr-soft: #33260f;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: inherit; text-decoration: none; }
a:hover .t { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px 8px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.onair { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: #fff; background: var(--warn); padding: 2px 6px; border-radius: 3px; }
.upd { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.search { margin-left: auto; flex: 1 1 220px; max-width: 320px; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav a { padding: 8px 12px 10px; color: var(--muted); font-weight: 500; white-space: nowrap; border-bottom: 2px solid transparent; }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav a .n { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 4px; }

main { padding-block: 20px 48px; }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12px; }
.stat.pr b { color: var(--pr); } .stat.good b { color: var(--good); } .stat.warn b { color: var(--warn); }

h2 { font-size: 15px; margin: 0; text-wrap: balance; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.panel > .hd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.hd .sub { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 4px 10px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); position: relative; }
.row:last-child { border-bottom: 0; }
.row::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 2px 2px 0; background: transparent; }
.row.s-good::before { background: var(--good); } .row.s-warn::before { background: var(--warn); } .row.s-pr::before { background: var(--pr); }
.when { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 2px; line-height: 1.4; }
.when .src { display: block; font-family: var(--sans); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.t { font-weight: 500; overflow-wrap: anywhere; }
.meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.co { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.pr { background: var(--pr-soft); color: var(--pr); border-color: transparent; font-weight: 600; }
.pill.dup { font-family: var(--mono); }
.prlines { margin: 2px 0 0; padding: 6px 10px; background: var(--pr-soft); border-radius: 6px; color: var(--ink); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.empty { padding: 28px 16px; color: var(--muted); text-align: center; }

/* 브리핑: ① 꼭 볼 것 카드 → ② 주제 묶음 → ③ 현황판 타일 → ④ 접힌 목록 */
.bhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 18px; }
.bhead .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.kpi { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.kpi b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.kpi.warn b { color: var(--warn); } .kpi.accent b { color: var(--accent); }
.bsec { margin-bottom: 26px; }
.bsec > .st { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.bsec > .st h2 { font-size: 16px; }
.bsec > .st span { color: var(--muted); font-size: 12px; }
.must { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--faint); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card.people { border-top-color: var(--pr); } .card.neg { border-top-color: var(--warn); } .card.obit { border-top-color: var(--ink); }
.card .lb { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; font-weight: 600; }
.card.people .lb { color: var(--pr); } .card.neg .lb { color: var(--warn); } .card.obit .lb { color: var(--ink); }
.card .lb span { font-family: var(--mono); font-weight: 500; color: var(--faint); }
.card .co { font-weight: 700; font-size: 15px; }
.card .tt { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card .do { margin-top: auto; align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.card.neg .do { background: var(--warn-soft); color: var(--warn); }
.themes { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.theme { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.theme:last-child { border-bottom: 0; }
.theme .nm { font-weight: 700; display: flex; flex-direction: column; }
.theme .nm small { font-weight: 500; color: var(--muted); font-size: 12px; }
.theme.neg .nm { color: var(--warn); }
.theme .mid { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.theme .top { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.theme .top:hover { text-decoration: underline; }
.theme .do { font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.theme.neg .do { color: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.bgroup { margin-bottom: 12px; }
.bgroup h3 { margin: 0 0 6px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .03em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 6px; }
.tile { border-radius: 6px; border: 1px solid var(--line); background: var(--surface); min-width: 0; }
.tile summary { list-style: none; cursor: pointer; padding: 7px 10px; display: flex; justify-content: space-between; gap: 6px; font-size: 13px; font-weight: 600; }
.tile summary::-webkit-details-marker { display: none; }
.tile summary .c { font-family: var(--mono); font-weight: 500; font-size: 11px; color: var(--faint); }
.tile.neg { background: var(--warn-soft); border-color: transparent; } .tile.neg summary { color: var(--warn); }
.tile.people { background: var(--pr-soft); border-color: transparent; } .tile.people summary { color: var(--pr); }
.tile.opp { background: var(--good-soft); border-color: transparent; } .tile.opp summary { color: var(--good); }
.tile.none { border-style: dashed; } .tile.none summary { color: var(--faint); font-weight: 500; cursor: default; }
.tile[open] { grid-column: 1 / -1; }
.tile ul { margin: 0; padding: 0 10px 8px; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.tile ul a { color: var(--ink); } .tile ul a:hover { text-decoration: underline; }
.tile ul .s { color: var(--faint); font-size: 11.5px; margin-left: 6px; }
.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.fold > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; }
.fold > summary span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
.fold ul { margin: 0; padding: 0 16px 12px; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.fold ul a:hover { text-decoration: underline; }
@media (max-width: 700px) { .theme { grid-template-columns: minmax(0, 1fr); gap: 6px; } }

/* 공문 작성: 왼쪽 입력, 오른쪽 A4 미리보기. 종이는 실제 문서처럼 항상 흰 바탕·검은 글씨 */
.gm-note { background: var(--pr-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.gm-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.gm-form { display: flex; flex-direction: column; }
.gm-fields { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
.gm-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gm-f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.gm-f span { font-size: 12px; color: var(--muted); font-weight: 600; }
.gm-f input, .gm-f select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; min-width: 0; }
.gm-han { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: -4px; }
.gm-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 16px 14px; }
.gm-btn { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
.gm-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.gm-msg { font-size: 12.5px; color: var(--muted); }
.gm-set { border-top: 1px solid var(--line); }
.gm-set > summary { cursor: pointer; padding: 11px 16px; font-weight: 600; }
.gm-set > summary small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.gm-seal-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 16px 8px; }
.gm-seal-box img { width: 56px; height: 56px; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
.gm-muted { color: var(--muted); font-size: 12px; margin: 0; padding: 0 16px 12px; }
.gm-seal-box .gm-muted { padding: 0; }
.gm-preview-wrap { min-width: 0; overflow: hidden; background: var(--line); border-radius: 8px; padding: 12px; }
.gm-scale { transform-origin: top left; }
/* 공문 종이: 부서 샘플 docx 수치 그대로 (A4, 여백 위15·좌우22.5·아래17.5mm, JTBC Regular 10pt, Word 줄간격 1.15) */
.gm-paper { width: 210mm; height: 297mm; box-sizing: border-box; padding: 15mm 22.5mm 17.5mm; background: #fff; color: #000; font-family: "JTBC Regular", "JTBC", "Malgun Gothic", "맑은 고딕", sans-serif; font-size: 10pt; line-height: 1.5; text-align: left; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.gm-paper.gm-print { box-shadow: none; height: 296mm; overflow: hidden; }
.w-head { width: 165.1mm; border-collapse: collapse; table-layout: fixed; line-height: 1.3; }
.w-head td { padding: 0; vertical-align: top; }
.w-head .w-r0 td { height: 15mm; }
.w-logo { width: 21.8mm; height: 10.8mm; display: block; }
.w-addr { width: 26mm; height: 24.2mm; display: block; }
.w-p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.w-def { margin-bottom: 10pt; }
.w-11 { font-size: 11pt; }
.w-15 { line-height: 1.95; }
.w-3 { font-size: 3pt; }
.w-14 { font-size: 14pt; }
.w-c { text-align: center; }
.w-sign-indent { padding-left: 45.5mm; }
.w-name { position: relative; }
.w-seal { position: absolute; left: 100%; top: 50%; margin-left: 1mm; width: 18mm; height: 18mm; transform: translateY(-50%); object-fit: contain; mix-blend-mode: multiply; } /* 직인: '전 진 배' 바로 오른쪽 */
.w-tbl { margin-left: auto; border-collapse: collapse; table-layout: fixed; font-size: 9pt; line-height: 1.3; }
.w-tbl th, .w-tbl td { border: 0.5pt solid #000; height: 6.8mm; padding: 0 1.9mm; text-align: center; vertical-align: middle; font-weight: 400; }
.w-tbl th { background: #d9d9d9; }
.gm-slot { width: 32px; font-size: 13px; }
.gm-f small { font-weight: 400; color: var(--accent); margin-left: 4px; }
.gm-row-item { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); }
.gm-edited { color: var(--pr); }
.gm-f textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; resize: vertical; }
@media (max-width: 900px) { .gm-grid { grid-template-columns: minmax(0, 1fr); } }

/* 인사·부고 단체 메시지 */
.msg-intro { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
.msg-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; align-items: start; }
.msg-card .hd .gm-btn { margin-left: auto; }
.msg-card.latest { border-color: var(--accent); }
.msg-text { display: block; width: 100%; box-sizing: border-box; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; font: 13px/1.6 var(--sans); color: var(--ink); background: var(--surface); resize: vertical; border-radius: 0 0 8px 8px; }

/* 기업 요약 · 캘린더 */
.sum-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.cosel2 { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; min-width: 220px; }
.sum-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 14px; }
.sum-head h2 { font-size: 20px; }
.sum-kpi { display: flex; gap: 8px; flex-wrap: wrap; }
.sum-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.sum-grid .wide2 { grid-column: 1 / -1; }
.sum-list { list-style: none; margin: 0; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.sum-list li { min-width: 0; overflow-wrap: anywhere; }
.sum-list a:hover { text-decoration: underline; }
.sum-list .d { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-right: 8px; }
.sum-empty { color: var(--muted); font-size: 12.5px; margin: 0; padding: 10px 16px 14px; }
.sum-go { color: var(--accent) !important; font-weight: 600; }
.cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.cal-main .hd h2 { min-width: 120px; text-align: center; }
.cal-main .hd .legend { margin-left: auto; margin-bottom: 0; }
.cal-seasons { display: flex; flex-direction: column; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.cal-season { font-size: 12.5px; color: var(--muted); } .cal-season b { color: var(--accent); font-weight: 600; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-h { padding: 6px; font-size: 12px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
.cal-cell { min-height: 86px; padding: 4px 5px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell.off { background: var(--bg); }
.cal-cell.today { background: var(--accent-soft); }
.cal-d { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cal-cell.sun .cal-d { color: var(--warn); } .cal-cell.sat .cal-d { color: var(--accent); }
.cal-ev { display: block; font-size: 11px; line-height: 1.35; padding: 2px 5px; border-radius: 4px; background: var(--bg); color: var(--ink); overflow-wrap: anywhere; }
.cal-ev.an { background: var(--good-soft); color: var(--good); font-weight: 600; }
.cal-ev.hol { background: var(--warn-soft); color: var(--warn); }
.cal-ev.season { background: var(--accent-soft); color: var(--accent); }
.cal-ev.mem { background: var(--pr-soft); color: var(--pr); }
.cal-ev.med { background: var(--good-soft); color: var(--ink); box-shadow: inset 3px 0 0 var(--good); }
.cal-ev.nev { background: var(--accent-soft); color: var(--accent); border: 1px dashed var(--accent); }
.cal-cell a:hover .cal-ev, .cal-side a:hover .cal-ev { text-decoration: underline; }
.cal-side .sum-list li { line-height: 1.6; }
.cal-side .cal-ev { display: inline; }
@media (max-width: 900px) { .sum-grid, .cal-wrap { grid-template-columns: minmax(0, 1fr); } .cal-cell { min-height: 64px; } }

/* 기업 뉴스 */
.split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; align-items: start; }
.colist { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 140px); overflow: auto; }
.cogroup { padding: 8px 0; border-bottom: 1px solid var(--line); }
.cogroup:last-child { border-bottom: 0; }
.cogroup h3 { margin: 0; padding: 2px 14px 4px; font-size: 11px; letter-spacing: .05em; color: var(--faint); font-weight: 600; }
.cobtn { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 14px; background: none; border: 0; color: var(--ink); font: inherit; cursor: pointer; text-align: left; }
.cobtn:hover { background: var(--bg); }
.cobtn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cobtn .c { font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 6px; }
.cobtn .c .w { color: var(--warn); }
.cosel { display: none; }

.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.foot { color: var(--faint); font-size: 12px; margin-top: 24px; line-height: 1.6; }

@media (max-width: 860px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .brief-grid, .two, .split { grid-template-columns: minmax(0, 1fr); }
  .colist { display: none; }
  .cosel { display: block; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; }
  .search { max-width: none; order: 3; flex-basis: 100%; }
}
@media (max-width: 480px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .when { display: flex; gap: 8px; } .when .src { display: inline; }
}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="onair">ON AIR</span>커뮤니케이션 2국</div>
      <span class="upd" id="upd">불러오는 중…</span>
      <label class="search"><input id="q" type="search" placeholder="기업·이름·키워드 검색" aria-label="검색"></label>
    </div>
    <nav id="nav" aria-label="메뉴"></nav>
  </div>
</header>

<main class="wrap" id="main"><div class="empty">데이터를 불러오는 중입니다.</div></main>

<script src="gongmun.js"></script>
<script>
const TABS = [
  ["briefing", "브리핑"], ["signals", "기회 알림"], ["news", "기업 뉴스"], ["company", "기업 요약"],
  ["people", "인사"], ["prlog", "홍보 라인"], ["obituary", "부고"], ["sponsor", "협찬 동향"],
  ["calendar", "캘린더"], ["msg", "인사·부고 메시지"], ["gongmun", "공문 작성"],
];
let D = null, view = "briefing", q = "";
const st = { tag: "전체", grp: "전체", co: null, prOnly: false, myOnly: false, obi: "주요", sp: "전체" };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NOW = () => (D ? new Date(D.updated) : new Date());
function ago(iso) {
  const m = Math.round((NOW() - new Date(iso)) / 60000);
  if (m < 60) return Math.max(m, 1) + "분 전";
  if (m < 1440) return Math.round(m / 60) + "시간 전";
  return Math.round(m / 1440) + "일 전";
}
const hit = (...parts) => !q || parts.join(" ").toLowerCase().includes(q);
const OPP = ["신제품·론칭", "마케팅·캠페인", "투자·신사업", "사회공헌·ESG", "행사·기념일"];

function row({ when, src, title, link, pills = "", extra = "", sig = "" }) {
  return `<li class="row ${sig}"><div class="when">${esc(when)}<span class="src">${esc(src)}</span></div>
  <div class="body"><a href="${esc(link)}" target="_blank" rel="noopener"><span class="t">${esc(title)}</span></a>${pills ? `<div class="meta">${pills}</div>` : ""}${extra}</div></li>`;
}
const pill = (t, c = "") => `<span class="pill ${c}">${esc(t)}</span>`;
const dup = (n) => (n > 1 ? pill(`보도 ${n}건`, "dup") : "");
const list = (items, f, emptyMsg = "조건에 맞는 항목이 없습니다.") => items.length ? `<ul class="rows">${items.map(f).join("")}</ul>` : `<div class="empty">${emptyMsg}</div>`;
const chips = (key, opts) => `<div class="chips">${opts.map((o) => `<button class="chip" data-k="${key}" data-v="${esc(o)}" aria-pressed="${st[key] === o}">${esc(o)}</button>`).join("")}</div>`;

// ---- 파생 데이터 ----
const prPeople = () => D.personnel.filter((p) => p.pr && p.pr.length);
const myPeople = () => D.personnel.filter((p) => p.companies && p.companies.length);
const keyObits = () => D.obituary.filter((o) => o.pr || o.exec || o.companies.length);
const oppNews = () => D.news.filter((n) => !n.caution.length && n.tags.some((t) => OPP.includes(t)));
const cautionNews = () => D.news.filter((n) => n.caution.length);

function stats() {
  return `<div class="strip">
    <div class="stat pr"><b>${prPeople().length}</b><span>홍보·마케팅 라인 인사</span></div>
    <div class="stat good"><b>${oppNews().length}</b><span>영업 기회 신호 (48시간)</span></div>
    <div class="stat warn"><b>${cautionNews().length}</b><span>부정이슈</span></div>
    <div class="stat"><b>${keyObits().length}</b><span>주요 부고 (홍보·임원·관심기업)</span></div>
  </div>`;
}

// ---- 화면 ----
const V = {
  briefing() {
    const b = D.briefing;
    if (!b || !b.must) return `<div class="empty">오늘 브리핑이 아직 작성되지 않았습니다. 다음 오전 9시 업데이트 때 만들어집니다.</div>`;
    const all = b.board.flatMap((g) => g.items);
    const negN = all.filter((i) => i.status === "neg").length;
    const live = all.filter((i) => i.status !== "none").length;
    const LBL = { people: "인사", neg: "부정이슈", obit: "부고" };
    const must = b.must.filter((m) => hit(m.company, m.title, m.label));
    const themes = b.themes.filter((t) => hit(t.title, t.companies.map((c) => c.name).join(" ")));
    const board = b.board
      .map((g) => ({ ...g, items: g.items.filter((i) => hit(i.name, i.news.map((n) => n.title).join(" "))) }))
      .filter((g) => g.items.length);
    const link = (href, inner, cls = "") => `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${inner}</a>`;
    const chipsOf = (t) => {
      const max = 8, cs = t.companies;
      return cs.slice(0, max).map((c) => link(c.link, esc(c.name) + (c.note ? " · " + esc(c.note) : ""), "pill " + (t.key === "neg" ? "warn" : "co"))).join("")
        + (cs.length > max ? pill(`외 ${cs.length - max}곳`) : "");
    };
    const tile = (i) => i.status === "none"
      ? `<div class="tile none"><summary>${esc(i.name)}<span class="c">–</span></summary></div>`
      : `<details class="tile ${i.status}"><summary>${esc(i.name)}<span class="c">${i.count}</span></summary><ul>${
          i.news.map((n) => `<li>${link(n.link, (n.neg ? "⚠ " : "") + esc(n.title))}<span class="s">${esc(n.source)} · ${ago(n.date)}</span></li>`).join("")
        }<li><a href="#company" data-sum="${esc(i.name)}" class="sum-go">기업 요약 보기 →</a></li></ul></details>`;

    return `
    <div class="bhead"><span class="eyebrow">${esc(b.date)} 브리핑 · 최근 ${b.winH}시간</span>
      <span class="kpi accent"><b>${b.must.length}</b>꼭 볼 것</span>
      <span class="kpi warn"><b>${negN}</b>부정이슈</span>
      <span class="kpi"><b>${live}/${all.length}</b>소식 있는 주요영업처</span></div>

    <section class="bsec"><div class="st"><h2>① 오늘 꼭 볼 것</h2><span>연락·조문·제안 보류처럼 오늘 움직여야 하는 것</span></div>
      ${must.length ? `<div class="must">${must.map((m) => link(m.link, `
        <div class="lb">${esc(m.label || LBL[m.type])}<span>${esc(m.when)}</span></div>
        <div class="co">${esc(m.company)}</div><div class="tt">${esc(m.title)}</div><span class="do">${esc(m.action)}</span>`, "card " + m.type)).join("")}</div>`
        : `<div class="empty">오늘은 바로 움직여야 할 일이 없습니다.</div>`}</section>

    <section class="bsec"><div class="st"><h2>② 주요 이슈</h2><span>주요영업처 소식을 주제별로 묶음 · 기업 이름을 누르면 기사</span></div>
      <div class="themes">${themes.map((t) => `<div class="theme ${t.key}">
        <div class="nm">${esc(t.title)}<small>${t.count}곳</small></div>
        <div class="mid"><div class="meta">${chipsOf(t)}</div>${t.top ? link(t.top.link, "대표 기사: " + esc(t.top.title), "top") : ""}</div>
        <div class="do">→ ${esc(t.action)}</div></div>`).join("") || `<div class="empty">묶을 만한 이슈가 없습니다.</div>`}</div></section>

    <section class="bsec"><div class="st"><h2>③ 주요영업처 현황판</h2><span>이름을 누르면 기사가 펼쳐집니다</span></div>
      <div class="legend"><span><i style="background:var(--warn)"></i>부정이슈</span><span><i style="background:var(--pr)"></i>인사</span><span><i style="background:var(--good)"></i>영업 기회</span><span><i style="background:var(--line)"></i>일반 소식</span><span>– 새 소식 없음</span></div>
      ${board.map((g) => `<div class="bgroup"><h3>${esc(g.group)}</h3><div class="tiles">${g.items.map(tile).join("")}</div></div>`).join("")}</section>

    <section class="bsec">
      <details class="fold"><summary>경조사<span>${b.obituary.length}건 · ★ 주요영업처</span></summary><ul>${
        b.obituary.map((o) => `<li>${link(o.link, (o.watch ? "★ " : "") + esc(o.title))} ${pill(o.when)}</li>`).join("")}</ul></details>
      <details class="fold"><summary>광고·협찬 동향<span>${b.sponsor.length}건</span></summary><ul>${
        b.sponsor.map((x) => `<li>${pill(x.type, "pr")} ${link(x.link, esc(x.title))}</li>`).join("")}</ul></details>
    </section>`;
  },
  signals() {
    const tags = ["전체", ...OPP];
    const grps = ["전체", ...new Set(D.companies.map((c) => c.group))];
    let opp = oppNews().filter((n) => (st.tag === "전체" || n.tags.includes(st.tag)) && (st.grp === "전체" || n.group === st.grp) && hit(n.title, n.company, n.source));
    opp.sort((a, b) => (b.dupes || 1) - (a.dupes || 1) || b.date.localeCompare(a.date));
    const cau = cautionNews().filter((n) => (st.grp === "전체" || n.group === st.grp) && hit(n.title, n.company));
    const f = (n, sig) => row({ when: ago(n.date), src: n.source, title: n.title, link: n.link, sig,
      pills: pill(n.company, "co") + (sig === "s-warn" ? n.caution.map((c) => pill(c, "warn")).join("") : n.tags.filter((t) => OPP.includes(t)).map((t) => pill(t, "good")).join("")) + dup(n.dupes) });
    return stats() + `<div class="two">
      <section class="panel"><div class="hd"><h2>제안 타이밍</h2><span class="sub">많이 보도된 순 · ${opp.length}건</span></div>
        <div class="toolbar">${chips("tag", tags)}</div><div class="toolbar">${chips("grp", grps)}</div>
        ${list(opp.slice(0, 150), (n) => f(n, "s-good"))}</section>
      <section class="panel"><div class="hd"><h2 style="color:var(--warn)">부정이슈</h2><span class="sub">${cau.length}건</span></div>
        ${list(cau, (n) => f(n, "s-warn"), "현재 부정이슈가 없습니다.")}</section></div>`;
  },
  news() {
    const by = {}; for (const n of D.news) (by[n.company] ||= []).push(n);
    if (!st.co) st.co = D.companies[0].name;
    const groups = [...new Set(D.companies.map((c) => c.group))];
    const side = groups.map((g) => `<div class="cogroup"><h3>${esc(g)}</h3>${D.companies.filter((c) => c.group === g).map((c) => {
      const arr = by[c.name] || []; const w = arr.filter((n) => n.caution.length).length;
      return `<button class="cobtn" data-co="${esc(c.name)}" aria-pressed="${st.co === c.name}">${esc(c.name)}<span class="c">${w ? `<span class="w">부정 ${w}</span>` : ""}${arr.length}</span></button>`;
    }).join("")}</div>`).join("");
    const sel = `<select class="cosel" id="cosel" aria-label="기업 선택">${D.companies.map((c) => `<option ${st.co === c.name ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>`;
    const items = (q ? D.news.filter((n) => hit(n.title, n.company, n.source)) : by[st.co] || []);
    return `<div class="split"><aside class="panel colist">${side}</aside>
      <section class="panel"><div class="hd"><h2>${q ? `"${esc(q)}" 검색 결과` : esc(st.co) + " 최근 48시간"}</h2><span class="sub">${items.length}건 · 같은 보도자료 기사는 하나로 묶음</span></div>
      <div class="toolbar">${sel}</div>
      ${list(items, (n) => row({ when: ago(n.date), src: n.source, title: n.title, link: n.link, sig: n.caution.length ? "s-warn" : n.tags.some((t) => OPP.includes(t)) ? "s-good" : "",
        pills: (q ? pill(n.company, "co") : "") + n.caution.map((c) => pill(c, "warn")).join("") + n.tags.map((t) => pill(t, OPP.includes(t) ? "good" : "")).join("") + dup(n.dupes) }))}
      </section></div>`;
  },
  people() {
    let p = D.personnel.filter((x) => (!st.prOnly || x.pr.length) && (!st.myOnly || x.companies.length) && hit(x.title, x.pr.join(" "), x.companies.join(" ")));
    const ex = D.execNews.filter((x) => (!st.myOnly || x.companies.length) && hit(x.title, x.source));
    return stats() + `<div class="two">
      <section class="panel"><div class="hd"><h2>연합뉴스 인사</h2><span class="sub">실시간 · ${p.length}건</span></div>
        <div class="toolbar"><label class="toggle"><input type="checkbox" id="prOnly" ${st.prOnly ? "checked" : ""}> 홍보·마케팅 라인만</label>
        <label class="toggle"><input type="checkbox" id="myOnly" ${st.myOnly ? "checked" : ""}> 관심 기업만</label></div>
        ${list(p, (x) => row({ when: x.time, src: "연합뉴스", title: x.title, link: x.link, sig: x.pr.length ? "s-pr" : "",
          pills: x.companies.map((c) => pill(c, "co")).join("") + (x.pr.length ? pill("홍보 라인 변동", "pr") : "") + (x.size > 1 ? pill(`${x.size}명`) : ""),
          extra: x.pr.length ? `<div class="prlines">${x.pr.map((l) => `<span>${esc(l)}</span>`).join("")}</div>` : "" }))}</section>
      <section class="panel"><div class="hd"><h2>그룹 정기 임원인사</h2><span class="sub">타 매체 · 최근 3일</span></div>
        ${list(ex, (x) => row({ when: ago(x.date), src: x.source, title: x.title, link: x.link, pills: x.companies.map((c) => pill(c, "co")).join("") + dup(x.dupes) }))}</section></div>`;
  },
  obituary() {
    const all = D.obituary.filter((o) => hit(o.title));
    const sel = st.obi === "주요" ? all.filter((o) => o.pr || o.exec || o.companies.length) : st.obi === "홍보·언론" ? all.filter((o) => o.pr) : all;
    return stats() + `<section class="panel"><div class="hd"><h2>연합뉴스 부고</h2><span class="sub">${sel.length}건</span></div>
      <div class="toolbar">${chips("obi", ["주요", "홍보·언론", "전체"])}</div>
      ${list(sel, (o) => row({ when: o.time, src: "연합뉴스", title: o.title, link: o.link, sig: o.pr ? "s-pr" : "",
        pills: o.companies.map((c) => pill(c, "co")).join("") + (o.pr ? pill("홍보·대외협력", "pr") : "") + (o.exec ? pill("임원·대표") : "") }))}</section>`;
  },
  sponsor() {
    const types = ["전체", ...new Set(D.sponsor.map((s) => s.type))];
    const s = D.sponsor.filter((x) => (st.sp === "전체" || x.type === st.sp) && hit(x.title, x.source, x.companies.join(" ")));
    return `<section class="panel"><div class="hd"><h2>광고·협찬 동향</h2><span class="sub">PPL·제작지원·광고모델·캠페인 보도 · 최근 7일 · ${s.length}건</span></div>
      <div class="toolbar">${chips("sp", types)}</div>
      ${list(s, (x) => row({ when: ago(x.date), src: x.source, title: x.title, link: x.link,
        pills: pill(x.type, x.type === "PPL" || x.type === "협찬·제작지원" ? "pr" : "") + x.companies.map((c) => pill(c, "co")).join("") + x.media.map((m) => pill(m)).join("") + dup(x.dupes) }))}</section>`;
  },
  prlog() {
    const L = (D.prlog || []).filter((x) => (!st.prWatch || x.companies.some((c) => WATCH.has(c))) && hit(x.org, x.lines.join(" "), x.companies.join(" ")));
    const md = (iso) => { const d = new Date(iso); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };
    return `<section class="panel"><div class="hd"><h2>홍보·커뮤니케이션·마케팅 라인 인사 기록</h2><span class="sub">연합뉴스 인사 기사에서 자동 누적 · ${L.length}건${(D.prlog || []).length ? ` · ${md(D.prlog[D.prlog.length - 1].date)}부터` : ""}</span></div>
      <div class="toolbar"><label class="toggle"><input type="checkbox" id="prWatch" ${st.prWatch ? "checked" : ""}> 주요영업처만</label><span class="sub">검색창에 기업명이나 이름을 넣으면 걸러집니다</span></div>
      ${list(L, (x) => row({ when: md(x.date), src: "연합뉴스", title: x.org, link: x.link, sig: "s-pr",
        pills: x.companies.map((c) => pill(c, WATCH.has(c) ? "co" : "")).join(""),
        extra: `<div class="prlines">${x.lines.map((l) => `<span>▲ ${esc(l)}</span>`).join("")}</div>` }), "기록된 홍보 라인 인사가 없습니다.")}</section>`;
  },
  company() {
    const watch = D.companies.filter((c) => c.watch && !/전체/.test(c.name));
    if (!st.sumCo) st.sumCo = watch[0].name;
    const sel = `<select class="cosel2" id="sumSel" aria-label="기업 선택">${[...new Set(watch.map((c) => c.group))].map((g) => `<optgroup label="${esc(g)}">${watch.filter((c) => c.group === g).map((c) => `<option ${c.name === st.sumCo ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</optgroup>`).join("")}</select>`;
    if (!HIST) { loadHist(); return `<div class="sum-top">${sel}</div><div class="empty">한 달치 기록을 불러오는 중입니다…</div>`; }
    const co = st.sumCo, H = HIST[co] || [];
    const news = H.filter((x) => x.kind === "news"), neg = news.filter((x) => x.caution && x.caution.length);
    const opp = news.filter((x) => !(x.caution || []).length && (x.tags || []).some((t) => OPP.includes(t)));
    const ppl = H.filter((x) => x.kind !== "news" || (x.tags || []).includes("인사·조직"));
    const prs = (D.prlog || []).filter((x) => x.companies.includes(co));
    const an = (D.anniv || {})[co];
    let docs = []; try { docs = JSON.parse(localStorage.getItem("gm.log") || "[]").filter((d) => d.co && (d.co.includes(co) || co.includes(d.co))); } catch {}
    const d10 = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
    const mini = (arr, f, empty) => arr.length ? `<ul class="sum-list">${arr.map(f).join("")}</ul>` : `<p class="sum-empty">${empty}</p>`;
    const ln = (x) => `<li><span class="d">${d10(x.date)}</span><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.dupes > 1 ? ` <span class="pill dup">보도 ${x.dupes}건</span>` : ""}</li>`;
    return `<div class="sum-top">${sel}<span class="sub">최근 ${news.length ? Math.max(1, Math.round((Date.now() - new Date(news[news.length - 1].date)) / 86400000)) : 0}일 기록 · 기록은 매일 쌓여 최대 35일까지 보관</span></div>
      <div class="sum-head panel"><div><h2>${esc(co)}</h2><span class="sub">${esc((watch.find((c) => c.name === co) || {}).group || "")}${an ? ` · ${an.what}기념일 ${+an.md.slice(0, 2)}월 ${+an.md.slice(3)}일 (${an.year}년 ${an.years}주년 기사 기준)` : ""}</span></div>
        <div class="sum-kpi"><span class="kpi"><b>${news.length}</b>기사</span><span class="kpi warn"><b>${neg.length}</b>부정이슈</span><span class="kpi accent"><b>${opp.length}</b>영업 기회</span><span class="kpi"><b>${ppl.length + prs.length}</b>인사·부고</span></div></div>
      <div class="sum-grid">
        <section class="panel"><div class="hd"><h2 style="color:var(--pr)">홍보 라인 변동</h2></div>${mini(prs.slice(0, 6), (x) => `<li><span class="d">${d10(x.date)}</span><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.org)}</a><div class="prlines">${x.lines.map((l) => `<span>▲ ${esc(l)}</span>`).join("")}</div></li>`, "기록된 홍보 라인 변동이 없습니다.")}</section>
        <section class="panel"><div class="hd"><h2 style="color:var(--warn)">부정이슈</h2></div>${mini(neg.slice(0, 6), ln, "부정이슈 기사가 없습니다.")}</section>
        <section class="panel"><div class="hd"><h2 style="color:var(--good)">영업 기회</h2></div>${mini(opp.slice(0, 8), ln, "영업 기회 기사가 없습니다.")}</section>
        <section class="panel"><div class="hd"><h2>인사·부고</h2></div>${mini(ppl.slice(0, 8), ln, "인사·부고 기사가 없습니다.")}</section>
        <section class="panel"><div class="hd"><h2>이 PC에서 만든 공문</h2><span class="sub">공문 작성 탭 기록</span></div>${mini(docs.slice(0, 8), (d) => `<li><span class="d">${esc(d.date || "")}</span>${esc(d.program || "")} · ${(+d.amount || 0).toLocaleString("ko-KR")}원 · ${esc(d.co)}</li>`, "이 브라우저에서 이 기업 공문을 만든 기록이 없습니다.")}</section>
        <section class="panel wide2"><div class="hd"><h2>최근 기사 전체</h2><span class="sub">${news.length}건</span></div>${mini(news.slice(0, 25), ln, "아직 쌓인 기사가 없습니다.")}</section>
      </div>`;
  },
  calendar() {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + (st.calOff || 0));
    const Y = base.getFullYear(), M = base.getMonth() + 1;
    const C = D.calendar || { seasons: [], events: [] }, A = D.anniv || {};
    const pad = (n) => String(n).padStart(2, "0");
    const md = (m, d) => `${pad(m)}-${pad(d)}`;
    const inSeason = (s, key) => (s.start <= s.end ? key >= s.start && key <= s.end : key >= s.start || key <= s.end);
    // 해마다 바뀌는 날: {m, wd, n} = m월 n째 wd요일 / {m, last:true} = m월 마지막 날 → 'MM-DD'
    const ruleKey = (r, y) => {
      if (r.last) return md(r.m, new Date(y, r.m, 0).getDate());
      const first = new Date(y, r.m - 1, 1).getDay();
      return md(r.m, 1 + ((r.wd - first + 7) % 7) + (r.n - 1) * 7);
    };
    const dayItems = (m, d, y = Y) => {
      const key = md(m, d), out = [];
      for (const e of C.events || []) if (e.date === key) out.push({ cls: e.type === "휴일" ? "hol" : "ev", t: e.title });
      for (const [co, a] of Object.entries(A)) if (a.md === key) out.push({ cls: "an", t: `${co} ${a.what}기념일` });
      for (const e of C.memorials || []) if ((e.rule ? ruleKey(e.rule, y) : e.date) === key) out.push({ cls: e.cat === "제약" ? "med" : "mem", t: e.title, note: e.for });
      const full = `${y}-${key}`;
      for (const e of D.newsEvents || []) if (e.date === full) out.push({ cls: "nev", t: e.company, full: e.title, link: e.link });
      return out;
    };
    // 칸 하나에 표시: 뉴스 감지 행사는 기사 링크, 기념일은 연결 상품을 말풍선으로
    const chip = (x, long) => {
      const tip = x.full || x.note || "";
      const text = long && x.cls === "nev" ? `${x.t} · ${x.full}` : long && x.note ? `${x.t} → ${x.note}` : x.cls === "nev" ? `${x.t} 행사` : x.t;
      const inner = `<span class="cal-ev ${x.cls}" title="${esc(tip)}">${esc(text)}</span>`;
      return x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${inner}</a>` : inner;
    };
    const first = new Date(Y, M - 1, 1).getDay(), last = new Date(Y, M, 0).getDate();
    const today = new Date(), isToday = (d) => today.getFullYear() === Y && today.getMonth() + 1 === M && today.getDate() === d;
    let cells = "";
    for (let i = 0; i < first; i++) cells += `<div class="cal-cell off"></div>`;
    for (let d = 1; d <= last; d++) {
      const its = dayItems(M, d), wd = (first + d - 1) % 7;
      cells += `<div class="cal-cell ${isToday(d) ? "today" : ""} ${wd === 0 || its.some((x) => x.cls === "hol") ? "sun" : wd === 6 ? "sat" : ""}"><span class="cal-d">${d}</span>${its.map((x) => chip(x, false)).join("")}</div>`;
    }
    const seasons = (C.seasons || []).filter((s) => { for (let d = 1; d <= last; d++) if (inSeason(s, md(M, d))) return true; return false; });
    // 앞으로 60일 일정
    const up = [];
    for (let i = 0; i < 60; i++) {
      const t = new Date(); t.setDate(t.getDate() + i);
      const key = md(t.getMonth() + 1, t.getDate());
      for (const x of dayItems(t.getMonth() + 1, t.getDate(), t.getFullYear())) if (x.cls !== "hol") up.push({ when: `${t.getMonth() + 1}/${t.getDate()}`, left: i, ...x });
      for (const s of C.seasons || []) if (s.start === key) up.push({ when: `${t.getMonth() + 1}/${t.getDate()}`, left: i, cls: "season", t: `${s.title} 시작` });
    }
    return `<div class="cal-wrap">
      <section class="panel cal-main"><div class="hd"><button class="gm-btn" data-cal="-1" aria-label="이전 달">‹</button><h2>${Y}년 ${M}월</h2><button class="gm-btn" data-cal="1" aria-label="다음 달">›</button>${st.calOff ? `<button class="gm-btn" data-cal="0">이번 달</button>` : ""}
        <span class="sub legend"><span><i style="background:var(--good)"></i>창립기념일</span><span><i style="background:var(--pr)"></i>캠페인 기념일</span><span><i style="background:var(--good);opacity:.55"></i>보건·질환의 날</span><span><i style="background:var(--accent)"></i>영업처 행사(뉴스 감지)</span><span><i style="background:var(--warn)"></i>휴일</span></span></div>
        ${seasons.length ? `<div class="cal-seasons">${seasons.map((s) => `<span class="cal-season"><b>${esc(s.title)}</b> ${s.start.replace("-", "/")}~${s.end.replace("-", "/")}${s.note ? ` · ${esc(s.note)}` : ""}</span>`).join("")}</div>` : ""}
        <div class="cal-grid">${["일", "월", "화", "수", "목", "금", "토"].map((w) => `<div class="cal-h">${w}</div>`).join("")}${cells}</div></section>
      <section class="panel cal-side"><div class="hd"><h2>다가오는 일정</h2><span class="sub">앞으로 60일</span></div>
        ${up.length ? `<ul class="sum-list">${up.map((x) => `<li><span class="d">${x.when}</span>${chip(x, true)}${x.left === 0 ? " <b>오늘</b>" : x.left <= 7 ? ` <span class="pill warn">D-${x.left}</span>` : ""}</li>`).join("")}</ul>` : `<p class="sum-empty">60일 안에 등록된 일정이 없습니다.</p>`}
        <p class="sum-empty">창립기념일은 뉴스에 난 기념식 기사 날짜 기준이라 실제 날짜와 하루 이틀 다를 수 있습니다. 시즌은 예년 기준입니다. 팀 일정 추가는 GitHub의 calendar.json에서 합니다.</p></section>
    </div>`;
  },
  msg() {
    const list = D.digest || [];
    if (!list.length) return `<div class="empty">아직 만들어진 메시지가 없습니다. 오전 10시·오후 4시 업데이트 때 자동으로 만들어집니다.</div>`;
    const t = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
    return `<div class="msg-intro">평일 <b>오전 10시</b>(전날 오후 메시지 이후 소식)·<b>오후 4시 30분</b>(당일 오전 메시지 이후 소식)에 자동으로 만들어집니다. 주말은 하루 1개입니다. <b>복사</b>를 누르고 메신저에 붙여넣으세요.</div>
      <div class="msg-list">${list.map((e, i) => `<section class="panel msg-card ${i === 0 ? "latest" : ""}">
        <div class="hd"><h2>${esc(e.date.slice(5).replace("-", "월 ").replace(/^0/, ""))}일 ${esc(e.slot)}</h2>
          <span class="sub">인사 ${e.people.length} · 부고 ${e.obits.length} · ${t(e.made)} 작성</span>
          <button type="button" class="gm-btn primary msg-copy" data-i="${i}">복사</button></div>
        <textarea class="msg-text" id="msgText${i}" readonly rows="${Math.min(18, e.text.split("\n").length + 1)}">${esc(e.text)}</textarea>
      </section>`).join("")}</div>`;
  },
  gongmun() {
    return window.GM ? GM.html(D) : `<div class="empty">공문 작성기를 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div>`;
  },
};

let HIST = null, histLoading = false;
let WATCH = new Set();
function loadHist() {
  if (histLoading) return; histLoading = true;
  fetch("history.json").then((r) => r.json()).then((h) => { HIST = h; if (view === "company") render(); })
    .catch(() => { HIST = {}; if (view === "company") render(); });
}
function render() {
  $("#nav").innerHTML = TABS.map(([k, label]) => {
    const n = { people: prPeople().length, obituary: keyObits().length, signals: cautionNews().length }[k];
    return `<a href="#${k}" ${view === k ? 'aria-current="page"' : ""}>${label}${n ? `<span class="n">${n}</span>` : ""}</a>`;
  }).join("");
  if (view === "gongmun") { $("#main").innerHTML = V.gongmun(); if (window.GM) GM.mount(); return; }
  $("#main").innerHTML = V[view]() + `<p class="foot">출처: 연합뉴스 인사·부고, 구글 뉴스 검색 결과의 각 언론사 기사. 제목과 링크만 모아 보여주며 기사 전문은 원문 사이트에서 확인하세요. 브리핑은 수집된 기사를 정해진 규칙에 따라 매일 오전 9시에 자동으로 정리한 것입니다.</p>`;
}
function route() { const h = location.hash.slice(1); view = TABS.some(([k]) => k === h) ? h : "briefing"; render(); window.scrollTo(0, 0); }

document.addEventListener("click", async (e) => {
  const cp = e.target.closest(".msg-copy");
  if (cp) {
    const ta = document.getElementById("msgText" + cp.dataset.i);
    try { await navigator.clipboard.writeText(ta.value); } catch { ta.select(); document.execCommand("copy"); }
    cp.textContent = "복사됨 ✓"; setTimeout(() => (cp.textContent = "복사"), 1800);
    return;
  }
  const cal = e.target.closest("[data-cal]");
  if (cal) { st.calOff = cal.dataset.cal === "0" ? 0 : (st.calOff || 0) + +cal.dataset.cal; render(); return; }
  const sum = e.target.closest("[data-sum]");
  if (sum) { e.preventDefault(); st.sumCo = sum.dataset.sum; location.hash = "company"; return; }
  const c = e.target.closest(".chip"); if (c) { st[c.dataset.k] = c.dataset.v; render(); return; }
  const b = e.target.closest(".cobtn"); if (b) { st.co = b.dataset.co; $("#q").value = ""; q = ""; render(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "prOnly" || e.target.id === "myOnly") { st[e.target.id] = e.target.checked; render(); }
  if (e.target.id === "cosel") { st.co = e.target.value; render(); }
  if (e.target.id === "prWatch") { st.prWatch = e.target.checked; render(); }
  if (e.target.id === "sumSel") { st.sumCo = e.target.value; render(); }
});
$("#q").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); if (view !== "gongmun") render(); });
window.addEventListener("hashchange", route);
window.addEventListener("gm-rerender", () => { if (view === "gongmun") render(); });

fetch("data.json").then((r) => r.json()).then((d) => {
  D = d;
  WATCH = new Set(D.companies.filter((c) => c.watch).map((c) => c.name));
  const fmt = (iso) => { const u = new Date(iso); return `${u.getMonth() + 1}/${u.getDate()} ${String(u.getHours()).padStart(2, "0")}:${String(u.getMinutes()).padStart(2, "0")}`; };
  const pu = D.peopleUpdated && D.peopleUpdated > D.updated ? ` · 인사·부고 ${fmt(D.peopleUpdated)}` : "";
  $("#upd").textContent = `전체 ${fmt(D.updated)}${pu} 업데이트`;
  route();
}).catch(() => { $("#main").innerHTML = `<div class="empty">데이터 파일(data.json)을 읽지 못했습니다. 수집기를 다시 실행한 뒤 페이지를 새로고침하세요.</div>`; $("#upd").textContent = ""; });
</script>
