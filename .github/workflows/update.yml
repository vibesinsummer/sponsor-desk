# 커뮤니케이션 2국 자동 업데이트
# 실행 시각은 외부 서비스 cron-job.org 가 정함 (GitHub 자체 예약은 크게 지연돼서 사용하지 않음)
#   매일 09:00 ~ 20:30, 30분마다 workflow_dispatch(mode=auto) 호출
#   auto: 한국 09:00~09:29 = 전체 수집 + 브리핑, 그 외 = 전체 수집(인사·부고 포함)
# 인사·부고 단체 메시지: 오전은 10:00 실행부터, 오후·주말은 16:30 실행부터 작성 (오전 10:30·오후 17:05 이후엔 고정)
# cron-job.org 설정: URL=https://api.github.com/repos/vibesinsummer/sponsor-desk/actions/workflows/update.yml/dispatches
#   POST, 헤더 Authorization: Bearer <토큰>, Accept: application/vnd.github+json, X-GitHub-Api-Version: 2022-11-28, Content-Type: application/json
#   본문 {"ref":"main","inputs":{"mode":"auto"}}

name: 자동 업데이트

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 종류 (auto = 시각에 맞춰 자동, brief = 전체+브리핑, full = 전체, people = 인사·부고만)"
        required: true
        default: "auto"
        type: choice
        options: [auto, brief, full, people]
  push:
    branches: [main]
    paths: ["index.html", "gongmun.js", "digest.js", "history.js", "calendar.json", "config.js", "collect.js", "briefing.js", "build.js"]

# 사이트 게시는 Vercel(combon.vercel.app)이 이 저장소의 새 저장을 감지해 자동으로 합니다.
permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 실행 종류 정하기
        id: mode
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:0 0 * * *") MODE=brief ;;
            "schedule:0 1 * * *") MODE=people ;;
            "schedule:0 7 * * *") MODE=full ;;
            "schedule:30 7 * * *") MODE=people ;;
            workflow_dispatch:*)  MODE="${{ github.event.inputs.mode }}" ;;
            *)                    MODE=none ;;   # 코드만 고친 경우: 수집 없이 사이트 빌드만 점검
          esac
          # auto (cron-job.org 가 30분마다 호출): 한국 시각 9:00~9:29 는 전체+브리핑, 그 외는 전체 수집
          #  인사·부고 메시지는 digest.js 규칙대로 오전 10:00·오후 16:30 실행부터 자동 작성
          if [ "$MODE" = "auto" ]; then
            HM=$(TZ=Asia/Seoul date +%H%M)
            if [ "$HM" -ge 0900 ] && [ "$HM" -lt 0930 ]; then MODE=brief; else MODE=full; fi
            echo "한국 시각 $HM → $MODE"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "실행 종류: $MODE"

      - name: 수집
        if: steps.mode.outputs.mode != 'none'
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            brief)  node collect.js brief ;;
            people) node collect.js people ;;
            *)      node collect.js ;;
          esac

      - name: 수집 결과 저장 (다음 실행 때 비교·보존용)
        if: steps.mode.outputs.mode != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json briefing.json history.json prlog.json anniv.json
          git diff --cached --quiet || git commit -m "자동 업데이트 (${{ steps.mode.outputs.mode }})"
          git pull --rebase
          git push

      # 사이트 파일이 제대로 만들어지는지 점검만 함 (실제 게시는 Vercel)
      - name: 사이트 빌드 점검
        run: node build.js
